<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="marco">
    <h1>Muro</h1>
    <p>Escribe algo. Lo verá cualquiera que abra esta página.</p>
  </div>
</header>
<main>
  <div class="nuevo">
    <input id="autor" placeholder="Tu nombre" maxlength="40">
    <textarea id="texto" placeholder="Escribe un mensaje" maxlength="280"></textarea>
    <button id="enviar">Publicar</button>
  </div>
  <div class="barra-acciones">
    <small id="estado">Cargando...</small>
    <button id="recargar" type="button" title="Actualizar los mensajes del muro">🔄 Actualizar muro</button>
  </div>
  <ul id="lista"></ul>
</main>
<script src="app.js" defer></script>
</body>
</html>
